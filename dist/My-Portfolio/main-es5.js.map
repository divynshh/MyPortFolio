<div class="skills-grid">
    <div class="skill-card" *ngFor="let category of categories">
      <h3 class="category-title">{{ category.title }}</h3>
      <ul>
        <li *ngFor="let skill of category.skills">
          <span class="skill-name">{{ skill.name }}</span>
          <mat-progress-bar
            class="skill-bar"
            mode="determinate"
            [value]="skill.level">
          </mat-progress-bar>
        </li>
      </ul>
    </div>
  </div>
